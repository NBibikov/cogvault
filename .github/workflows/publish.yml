name: Release

# Push a tag `vX.Y.Z` whose version matches pyproject.toml and server.json:
# test → build → PyPI (trusted publishing) → MCP Registry (GitHub OIDC) → GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-${{ hashFiles('src/cogvault/core.py') }}
          restore-keys: fastembed-
      - run: pip install -e ".[dev]"
      - run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Versions agree
        run: |
          PKG=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          SRV=$(jq -r .version server.json)
          SRV_PKG=$(jq -r '.packages[0].version' server.json)
          echo "pyproject=$PKG server.json=$SRV/$SRV_PKG ref=$GITHUB_REF_NAME"
          PLUG=$(jq -r .version plugin/.claude-plugin/plugin.json)
          echo "plugin.json=$PLUG"
          test "$PKG" = "$SRV" && test "$PKG" = "$SRV_PKG" && test "$PKG" = "$PLUG"
          # the plugin directory requires an exact pin on the uvx launcher
          grep -q "\"cogvault==$PKG\"" plugin/.mcp.json
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then test "v$PKG" = "$GITHUB_REF_NAME"; fi
      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cogvault/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - name: Publish (retry while PyPI propagates)
        run: |
          for i in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            echo "attempt $i failed, retrying in 30s"; sleep 30
          done
          exit 1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - name: Create release with changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=${GITHUB_REF_NAME#v}
          awk -v v="$VER" '$0 ~ "^## "v" " {f=1; print; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
          TITLE=$(head -1 notes.md | sed 's/^## //')
          tail -n +2 notes.md > body.md
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" dist/* --clobber \
            || gh release create "$GITHUB_REF_NAME" dist/* --title "$TITLE" --notes-file body.md
